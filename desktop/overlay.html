<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src blob:; connect-src 'none'"
    />
    <meta charset="utf-8" />
    <title>Mockingbird</title>
    <style>
      :root {
        --ink: #e8ecf1;
        --muted: rgba(232, 236, 241, 0.55);
        --glass: rgba(13, 17, 23, 0.9);
        --line: rgba(255, 255, 255, 0.07);
        --listen: #e04545;
        --command: #6ea8fe;
        --work: #8d6ee8;
        --ok: #3fbf78;
        --warn: #d9a521;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
        font:
          500 13px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
      }
      /* Everything hangs off the bottom of the window so the pill grows upward
     into a card without the window ever moving. */
      body {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 8px;
        box-sizing: border-box;
      }

      .card {
        width: 100%;
        background: var(--glass);
        -webkit-backdrop-filter: blur(18px) saturate(1.5);
        backdrop-filter: blur(18px) saturate(1.5);
        border-radius: 18px;
        box-shadow:
          0 10px 34px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.09),
          inset 0 0 0 1px var(--line);
        overflow: hidden;
        transform: translateY(6px) scale(0.985);
        opacity: 0;
        transition:
          opacity 0.18s ease,
          transform 0.3s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      .card.in {
        opacity: 1;
        transform: none;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px 18px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex: none;
        background: var(--listen);
      }
      .listening .dot {
        animation: pulse 1.5s ease infinite;
      }
      .command .dot {
        background: var(--command);
      }
      .working .dot {
        background: var(--work);
        animation: none;
      }
      .done .dot {
        background: var(--ok);
        animation: none;
      }
      .error .dot {
        background: var(--warn);
        animation: none;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.3);
          opacity: 0.6;
        }
      }

      .bars {
        display: inline-flex;
        gap: 3px;
        align-items: center;
        height: 20px;
        flex: none;
      }
      .bars i {
        width: 3.5px;
        height: 5px;
        border-radius: 2px;
        background: #ff9d94;
        transition: height 0.07s ease;
      }
      .command .bars i {
        background: #a9caff;
      }
      .working .bars,
      .done .bars,
      .error .bars {
        display: none;
      }

      .label {
        flex: 1;
        min-width: 0;
      }
      .label .line1 {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .label .line2 {
        margin-top: 3px;
        color: var(--muted);
        font-weight: 400;
        font-size: 12px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .muted {
        color: var(--muted);
        font-weight: 400;
      }
      .keys {
        flex: none;
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
        white-space: nowrap;
      }
      kbd {
        font: inherit;
        padding: 1px 5px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      /* --- confirmation --- */
      .actions {
        padding: 16px;
        user-select: text;
        border-top: 1px solid var(--line);
        max-height: 150px;
        overflow-y: auto;
      }
      .action {
        padding: 11px 18px;
        border-bottom: 1px solid var(--line);
      }
      .action:last-child {
        border-bottom: none;
      }
      .action .title {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .action .verb {
        text-transform: capitalize;
      }
      .action .where {
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
        padding: 1px 7px;
        border-radius: 999px;
        background: rgba(110, 168, 254, 0.14);
        color: #a9caff;
      }
      .fields {
        margin: 6px 0 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        font-size: 12px;
        font-weight: 400;
      }
      .fields dt {
        color: var(--muted);
      }
      .fields dd {
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 18px;
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.02);
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
      }
      button {
        padding: 9px 14px;
        margin: 10px 8px 0 0;
        border-radius: 10px;
        border: 1px solid #596779;
        background: #243653;
        color: white;
        cursor: pointer;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="row" id="row">
        <div class="dot"></div>
        <div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="label">
          <div class="line1" id="line1">Listening…</div>
          <div class="line2 hidden" id="line2"></div>
        </div>
        <div class="keys" id="keys"></div>
      </div>
      <div class="actions hidden" id="actions"></div>
      <div class="footer hidden" id="footer">
        <span id="footerText">Review before replacing</span>
        <span><kbd>↵</kbd> accept &nbsp; <kbd>esc</kbd> cancel</span>
      </div>
    </div>

    <script src="overlay.js"></script>
  </body>
</html>
