# Every push checks consumer API security, gift/billing behavior, PostgreSQL,
# desktop behavior with a simulated OS, static pages, and legacy connector shapes.
# Browser/real-OS release checks are separate; no live credentials are needed.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Run tests
        run: npm test
